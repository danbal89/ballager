<html lang="de">
<head>

<body>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navigation">
    <a href="#/" data-nav="home"><span class="ti">🏠</span><span>Übersicht</span></a>
    <a href="#/vorrat" data-nav="vorrat"><span class="ti">🗄️</span><span>Vorrat</span></a>

      <button class="sheet-close" data-close aria-label="Schließen">✕</button>

    </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
